<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Recipe Finder</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:wght@400;700&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0d1f0d;color:#d1fae5;font-family:system-ui,sans-serif;min-height:100vh;padding:1.5rem 1rem 4rem}
  @keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
  @keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
  .skel{background:linear-gradient(90deg,#1a3a1a 25%,#2a5a2a 50%,#1a3a1a 75%);background-size:400px 100%;animation:shimmer 1.4s infinite;border-radius:6px}
  ::-webkit-scrollbar{width:6px}
  ::-webkit-scrollbar-track{background:#0d1f0d}
  ::-webkit-scrollbar-thumb{background:#2a4a2a;border-radius:3px}

  /* Layout */
  .container{max-width:640px;margin:0 auto}
  .header{text-align:center;margin-bottom:2rem;animation:fadeIn .6s ease}
  .header-emoji{font-size:2.5rem;margin-bottom:.3rem}
  .header h1{font-family:'Special Elite',cursive;font-size:clamp(2rem,7vw,3rem);color:#4ade80;text-shadow:0 0 40px #4ade8044;letter-spacing:.04em;line-height:1}
  .header p{color:#86efac88;font-family:monospace;font-size:.78rem;margin-top:.4rem}

  /* Input panel */
  .panel{background:linear-gradient(135deg,#1a2e1a,#0f1f0f);border:1px solid #2a4a2a;border-radius:16px;padding:1.5rem;margin-bottom:2rem;animation:fadeIn .7s ease}
  .label{font-family:monospace;font-size:.65rem;color:#4ade8088;margin-bottom:4px;letter-spacing:.1em;display:block}

  /* Quick fills */
  .quick-fills{margin-bottom:1rem}
  .quick-fills-row{display:flex;gap:.4rem;flex-wrap:wrap}
  .quick-btn{background:#0f1f0f;border:1px solid #2a4a2a;color:#86efac;border-radius:6px;padding:.3rem .6rem;font-size:.72rem;cursor:pointer;font-family:monospace;transition:all .2s}
  .quick-btn:hover{border-color:#4ade80;color:#4ade80}

  /* Textarea */
  textarea{width:100%;background:#0f1f0f;border:1px solid #2a4a2a;border-radius:10px;color:#d1fae5;font-family:monospace;font-size:.85rem;padding:.9rem;resize:vertical;outline:none;line-height:1.6;margin-bottom:1rem;transition:border-color .2s}
  textarea:focus{border-color:#4ade80}

  /* Filters */
  .filters{display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap}
  .filter-group{flex:1 1 140px;min-width:0}
  select{width:100%;background:#0f1f0f;border:1px solid #2a4a2a;color:#86efac;border-radius:8px;padding:.5rem .7rem;font-size:.78rem;font-family:monospace;cursor:pointer;outline:none}
  select option{background:#0f1f0f}

  /* Buttons */
  .btn-generate{width:100%;background:linear-gradient(135deg,#166534,#14532d);border:2px solid #4ade80;color:#4ade80;border-radius:10px;padding:.85rem;font-family:'Special Elite',cursive;font-size:1.1rem;cursor:pointer;letter-spacing:.05em;transition:all .3s;box-shadow:0 0 20px #4ade8022}
  .btn-generate:disabled{background:#1a3a1a;border-color:#2a4a2a;color:#4ade8055;cursor:not-allowed;box-shadow:none}
  .btn-regen{width:100%;margin-top:.5rem;background:transparent;border:1px solid #2a4a2a;color:#86efac88;border-radius:8px;padding:.55rem;font-family:monospace;font-size:.78rem;cursor:pointer;display:none}

  /* Empty state */
  .empty{text-align:center;color:#4ade8033;font-family:monospace;font-size:.82rem;padding:3rem 1rem;border:1px dashed #2a4a2a;border-radius:12px;line-height:2}

  /* Error */
  .error-box{background:#2a0f0f;border:1px solid #f87171;border-radius:10px;padding:1rem;color:#fca5a5;font-family:monospace;font-size:.82rem;text-align:center}

  /* Skeleton */
  .skeleton{animation:fadeIn .4s ease}
  .skel-card{background:linear-gradient(135deg,#1a2e1a,#0f1f0f);border:1px solid #2a4a2a;border-radius:12px;padding:2rem;margin-bottom:1.5rem}
  .skel-header{display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem}
  .skel-title-block{flex:1}
  .skel-text{margin-bottom:8px}
  .skel-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:1.5rem}
  .skel-pulse{text-align:center;color:#4ade8088;font-family:monospace;font-size:.85rem;animation:pulse 1.5s ease-in-out infinite}

  /* Recipe card */
  .recipe{animation:fadeIn .6s ease}
  .recipe-header{background:linear-gradient(135deg,#1a3a1a,#0f2a0f);border:1px solid #3a6a3a;border-radius:16px;padding:1.8rem;margin-bottom:1rem}
  .recipe-title-row{display:flex;align-items:flex-start;gap:1rem;margin-bottom:1rem}
  .recipe-emoji{font-size:3rem;line-height:1}
  .recipe-name{font-family:'Special Elite',cursive;font-size:1.6rem;color:#4ade80;line-height:1.2}
  .badges{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.4rem}
  .badge{border-radius:6px;padding:.15rem .55rem;font-size:.7rem;font-family:monospace}
  .badge-cyan{background:#22d3ee22;border:1px solid #22d3ee55;color:#22d3ee}
  .badge-yellow{background:#fbbf2422;border:1px solid #fbbf2455;color:#fbbf24}
  .recipe-desc{color:#86efac;font-size:.88rem;line-height:1.6}
  .meta-row{display:flex;gap:.8rem;margin-top:1rem;flex-wrap:wrap;align-items:center}
  .meta-chip{background:#0f1f0f;border:1px solid #2a4a2a;border-radius:8px;padding:.5rem .8rem;font-size:.78rem;color:#86efac;font-family:monospace}
  .meta-chip strong{color:#4ade80}
  .servings-ctrl{background:#0f1f0f;border:1px solid #22d3ee44;border-radius:8px;padding:.4rem .8rem;display:flex;align-items:center;gap:.6rem}
  .servings-ctrl span.label-s{font-size:.78rem;color:#22d3ee;font-family:monospace}
  .servings-ctrl span.count{color:#4ade80;font-weight:700;font-family:monospace;min-width:20px;text-align:center}
  .adj-btn{background:#1a3a1a;border:1px solid #2a4a2a;color:#4ade80;border-radius:4px;width:24px;height:24px;cursor:pointer;font-size:.9rem;font-family:monospace;display:flex;align-items:center;justify-content:center;line-height:1}

  /* Nutrition */
  .nutrition-row{display:flex;gap:.6rem;margin-bottom:1rem;flex-wrap:wrap}
  .nutr-card{background:#0f1f0f;border-radius:10px;padding:1rem;text-align:center;flex:1;min-width:0}
  .nutr-val{font-size:1.4rem;font-weight:700;font-family:monospace}
  .nutr-unit{font-size:.65rem;color:#86efac88;margin-top:2px}
  .nutr-lbl{font-size:.7rem;color:#86efac;margin-top:4px;font-family:monospace}

  /* Section box */
  .section{background:linear-gradient(135deg,#1a2e1a,#0f1f0f);border:1px solid #2a4a2a;border-radius:12px;padding:1.3rem;margin-bottom:1rem}
  .section-title{font-family:'Special Elite',cursive;font-size:1.1rem;color:#4ade80;margin-bottom:.9rem}
  .section-tips{border-color:#fbbf2444}
  .section-tips .section-title{color:#fbbf24}

  /* Ingredients grid */
  .ing-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.6rem}
  .ing-chip{background:#0f1f0f;border:1px solid #2a4a2a;border-radius:8px;padding:.6rem .8rem;font-size:.8rem;color:#86efac;font-family:monospace}
  .ing-chip strong{color:#4ade80}

  /* Steps */
  .steps-list{display:flex;flex-direction:column;gap:.6rem}
  .step{background:#0f1f0f;border:1px solid #2a4a2a;border-radius:10px;padding:.9rem 1rem;cursor:pointer;transition:all .3s;display:flex;gap:.8rem;align-items:flex-start}
  .step.done{background:#0a2a0a;border-color:#4ade80;opacity:.5}
  .step-num{width:26px;height:26px;border-radius:50%;background:#1a3a1a;border:2px solid #3a6a3a;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.7rem;color:#4ade80;font-weight:700;font-family:monospace;transition:all .3s}
  .step.done .step-num{background:#4ade80;border-color:#4ade80;color:#0f1f0f}
  .step-title{font-weight:700;color:#4ade80;font-size:.82rem;margin-bottom:3px;font-family:monospace}
  .step.done .step-title,.step.done .step-text{text-decoration:line-through}
  .step-text{color:#86efac;font-size:.82rem;line-height:1.6}

  /* Tips */
  .tips-list{display:flex;flex-direction:column;gap:.5rem}
  .tip-row{display:flex;gap:.7rem;align-items:flex-start}
  .tip-arrow{color:#fbbf24;font-family:monospace;font-size:.85rem;flex-shrink:0}
  .tip-text{color:#d1fae5;font-size:.83rem;line-height:1.6}
</style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <div class="header">
    <div class="header-emoji">🍳🔍</div>
    <h1>AI RECIPE FINDER</h1>
    <p>Powered by Anthropic Claude · Enter ingredients, get a full recipe</p>
  </div>

  <!-- Input Panel -->
  <div class="panel">
    <div class="quick-fills">
      <span class="label">QUICK FILL</span>
      <div class="quick-fills-row" id="quickFills"></div>
    </div>

    <textarea id="ingredients" rows="3" placeholder="e.g. chicken, garlic, lemon, potatoes, olive oil, rosemary..."></textarea>

    <div class="filters">
      <div class="filter-group">
        <span class="label">DIETARY</span>
        <select id="dietary">
          <option>None</option><option>Vegetarian</option><option>Vegan</option>
          <option>Keto</option><option>Gluten-free</option><option>Halal</option><option>Dairy-free</option>
        </select>
      </div>
      <div class="filter-group">
        <span class="label">CUISINE</span>
        <select id="cuisine">
          <option>Any</option><option>Filipino</option><option>Italian</option><option>Asian</option>
          <option>Mexican</option><option>Indian</option><option>French</option><option>Mediterranean</option>
        </select>
      </div>
      <div class="filter-group">
        <span class="label">TIME</span>
        <select id="time">
          <option>Any time</option><option>Under 15 mins</option><option>Under 30 mins</option>
          <option>Under 1 hour</option><option>Over 1 hour</option>
        </select>
      </div>
    </div>

    <button class="btn-generate" id="generateBtn" onclick="generateRecipe()">✨ Generate Recipe</button>
    <button class="btn-regen" id="regenBtn" onclick="generateRecipe()">🔄 Regenerate with same ingredients</button>
  </div>

  <!-- Output -->
  <div id="output">
    <div class="empty">🍽️<br/>Enter ingredients above<br/>and hit Generate Recipe</div>
  </div>
</div>

<script>
const QUICK_FILLS = [
  { label: "🍳 Breakfast", value: "eggs, butter, cheese, bread, milk" },
  { label: "🍝 Pasta Night", value: "pasta, garlic, olive oil, tomatoes, basil, parmesan" },
  { label: "🍗 Chicken Dinner", value: "chicken breast, garlic, lemon, rosemary, potatoes, olive oil" },
  { label: "🥗 Healthy Bowl", value: "quinoa, spinach, avocado, cucumber, chickpeas, lemon" },
  { label: "🍜 Asian Fusion", value: "rice, soy sauce, ginger, garlic, carrots, broccoli, sesame oil" },
];

// Render quick fill buttons
const qfContainer = document.getElementById('quickFills');
QUICK_FILLS.forEach(q => {
  const btn = document.createElement('button');
  btn.className = 'quick-btn';
  btn.textContent = q.label;
  btn.onclick = () => { document.getElementById('ingredients').value = q.value; };
  qfContainer.appendChild(btn);
});

// Servings state
let currentServings = 2;
let baseServings = 2;
let currentRecipe = null;

async function generateRecipe() {
  const ingredients = document.getElementById('ingredients').value.trim();
  if (!ingredients) return;

  const dietary = document.getElementById('dietary').value;
  const cuisine = document.getElementById('cuisine').value;
  const time = document.getElementById('time').value;

  document.getElementById('generateBtn').disabled = true;
  document.getElementById('generateBtn').textContent = '✨ Generating Recipe...';
  document.getElementById('regenBtn').style.display = 'none';
  showSkeleton();

  try {
    const res = await fetch('http://localhost:3000/api/recipe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ingredients, dietary, cuisine, time })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    currentRecipe = data;
    currentServings = data.servings || 2;
    baseServings = data.servings || 2;
    renderRecipe(data);
    document.getElementById('regenBtn').style.display = 'block';
  } catch (err) {
    document.getElementById('output').innerHTML = `<div class="error-box">⚠️ ${err.message || 'Failed to generate recipe. Is the backend running?'}</div>`;
  } finally {
    document.getElementById('generateBtn').disabled = false;
    document.getElementById('generateBtn').textContent = '✨ Generate Recipe';
  }
}

function showSkeleton() {
  document.getElementById('output').innerHTML = `
    <div class="skeleton">
      <div class="skel-card">
        <div class="skel-header">
          <div class="skel" style="width:56px;height:56px;border-radius:12px;flex-shrink:0"></div>
          <div class="skel-title-block">
            <div class="skel skel-text" style="height:28px;width:60%"></div>
            <div class="skel" style="height:16px;width:40%"></div>
          </div>
        </div>
        <div class="skel skel-text" style="height:16px;width:90%"></div>
        <div class="skel skel-text" style="height:16px;width:70%"></div>
        <div class="skel" style="height:16px;width:80%"></div>
        <div class="skel-grid">
          <div class="skel" style="height:64px"></div>
          <div class="skel" style="height:64px"></div>
          <div class="skel" style="height:64px"></div>
          <div class="skel" style="height:64px"></div>
        </div>
      </div>
      <p class="skel-pulse">🤖 Claude is crafting your recipe...</p>
    </div>`;
}

function scaleAmt(amount, ratio) {
  const num = parseFloat(amount);
  if (isNaN(num)) return amount;
  const s = num * ratio;
  return s % 1 === 0 ? s : s.toFixed(1);
}

function updateServingsDisplay() {
  if (!currentRecipe) return;
  const ratio = currentServings / baseServings;
  document.getElementById('servingsCount').textContent = currentServings;

  // Update ingredients
  currentRecipe.ingredients.forEach((ing, i) => {
    const el = document.getElementById(`ing-${i}`);
    if (el) el.innerHTML = `<strong>${scaleAmt(ing.amount, ratio)}</strong> ${ing.item}`;
  });

  // Update nutrition
  if (currentRecipe.nutrition) {
    const n = currentRecipe.nutrition;
    const fields = { cal: n.calories, prot: n.protein, carb: n.carbs, fat: n.fat };
    Object.entries(fields).forEach(([k, v]) => {
      const el = document.getElementById(`nutr-${k}`);
      if (el) el.textContent = k === 'cal' ? Math.round(v * ratio) : `${Math.round(v * ratio)}g`;
    });
  }
}

function toggleStep(idx) {
  const el = document.getElementById(`step-${idx}`);
  const num = document.getElementById(`stepnum-${idx}`);
  if (!el) return;
  el.classList.toggle('done');
  num.textContent = el.classList.contains('done') ? '✓' : idx + 1;
}

function renderRecipe(r) {
  const nutrHTML = r.nutrition ? `
    <div class="nutrition-row">
      <div class="nutr-card" style="border:1px solid #fbbf2444">
        <div class="nutr-val" style="color:#fbbf24" id="nutr-cal">${r.nutrition.calories}</div>
        <div class="nutr-unit">kcal</div><div class="nutr-lbl">Calories</div>
      </div>
      <div class="nutr-card" style="border:1px solid #4ade8044">
        <div class="nutr-val" style="color:#4ade80" id="nutr-prot">${r.nutrition.protein}g</div>
        <div class="nutr-unit">protein</div><div class="nutr-lbl">Protein</div>
      </div>
      <div class="nutr-card" style="border:1px solid #22d3ee44">
        <div class="nutr-val" style="color:#22d3ee" id="nutr-carb">${r.nutrition.carbs}g</div>
        <div class="nutr-unit">carbs</div><div class="nutr-lbl">Carbs</div>
      </div>
      <div class="nutr-card" style="border:1px solid #f472b644">
        <div class="nutr-val" style="color:#f472b6" id="nutr-fat">${r.nutrition.fat}g</div>
        <div class="nutr-unit">fat</div><div class="nutr-lbl">Fat</div>
      </div>
    </div>` : '';

  const ingsHTML = (r.ingredients || []).map((ing, i) =>
    `<div class="ing-chip" id="ing-${i}"><strong>${ing.amount}</strong> ${ing.item}</div>`
  ).join('');

  const stepsHTML = (r.steps || []).map((s, i) => `
    <div class="step" id="step-${i}" onclick="toggleStep(${i})">
      <div class="step-num" id="stepnum-${i}">${i + 1}</div>
      <div>
        ${s.title ? `<div class="step-title">${s.title}</div>` : ''}
        <div class="step-text">${s.instruction}</div>
      </div>
    </div>`
  ).join('');

  const tipsHTML = r.tips && r.tips.length ? `
    <div class="section section-tips">
      <div class="section-title">💡 Chef's Tips</div>
      <div class="tips-list">
        ${r.tips.map(t => `<div class="tip-row"><span class="tip-arrow">→</span><span class="tip-text">${t}</span></div>`).join('')}
      </div>
    </div>` : '';

  document.getElementById('output').innerHTML = `
    <div class="recipe">
      <div class="recipe-header">
        <div class="recipe-title-row">
          <div class="recipe-emoji">${r.emoji || '🍽️'}</div>
          <div>
            <div class="recipe-name">${r.name}</div>
            <div class="badges">
              ${r.cuisine ? `<span class="badge badge-cyan">${r.cuisine}</span>` : ''}
              ${r.difficulty ? `<span class="badge badge-yellow">${r.difficulty}</span>` : ''}
            </div>
          </div>
        </div>
        <p class="recipe-desc">${r.description}</p>
        <div class="meta-row">
          <div class="meta-chip">⏱ <strong>Prep:</strong> ${r.prepTime}</div>
          <div class="meta-chip">🔥 <strong>Cook:</strong> ${r.cookTime}</div>
          <div class="servings-ctrl">
            <span class="label-s">🍽 Servings:</span>
            <button class="adj-btn" onclick="currentServings=Math.max(1,currentServings-1);updateServingsDisplay()">−</button>
            <span class="count" id="servingsCount">${r.servings || 2}</span>
            <button class="adj-btn" onclick="currentServings++;updateServingsDisplay()">+</button>
          </div>
        </div>
      </div>
      ${nutrHTML}
      <div class="section">
        <div class="section-title">🧺 Ingredients</div>
        <div class="ing-grid">${ingsHTML}</div>
      </div>
      <div class="section">
        <div class="section-title">📋 Instructions</div>
        <div class="steps-list">${stepsHTML}</div>
      </div>
      ${tipsHTML}
    </div>`;
}
</script>
</body>
</html>
